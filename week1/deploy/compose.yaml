services:
  week1:
    build:
      context: ../..
      dockerfile: week1/deploy/Dockerfile
    ports:
      - "8011:8011"
    env_file:
      - ../../.env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8011/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
