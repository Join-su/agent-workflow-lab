[project]
name = "agent-workflow-lab"
version = "0.2.0"
description = "Three progressive LangChain and LangGraph production-workflow learning labs"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "langchain>=1.0,<2.0",
  "langchain-text-splitters>=1.0,<2.0",
  "langchain-openai>=1.0,<2.0",
  "langchain-postgres>=0.0.16,<1.0",
  "langgraph>=1.0,<2.0",
  "psycopg[binary]>=3.2,<4.0",
  "uvicorn>=0.30,<1.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
  "httpx>=0.27,<1.0",
  "jupyter>=1.1,<2.0",
]
