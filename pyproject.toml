[project]
name = "agent-workflow-lab"
version = "0.1.0"
description = "Fixture-driven weekly practice lab for AI Agent service development"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "langchain>=1.0,<2.0",
  "langchain-text-splitters>=1.0,<2.0",
  "langgraph>=1.0,<2.0",
  "langchain-openai>=0.3,<2.0",
  "langchain-postgres>=0.0.14,<1.0",
  "psycopg[binary]>=3.2,<4.0",
  "streamlit>=1.57,<2.0",
  "uvicorn>=0.30",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.27,<1.0",
    "jupyter>=1.1,<2.0",
]
